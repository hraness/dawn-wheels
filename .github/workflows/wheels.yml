name: Wheels

# Every push and pull request builds and tests the wheels. A tag v* also
# publishes them as an immutable release, each wheel with a build provenance
# attestation.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded # 2026.11.01-2
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676 # 2026.11.01-2
          - target: any
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded # 2026.11.01-2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with uv's CPython 3.12.14
        if: ${{ !matrix.image }}
        env:
          UV_VERSION: "0.12.12"
          UV_SHA256: 46740540b63fdee9a6cb2e19baf3f1f475b850c440a33e63455087a6871263f1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-aarch64-apple-darwin.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          uv="$RUNNER_TEMP/uv-aarch64-apple-darwin/uv"
          "$uv" python install 3.12.14
          python="$("$uv" python find --managed-python 3.12.14)"
          clang --version | head -1
          "$python" -I scripts/build.py "${{ matrix.target }}" dist

      - name: Build in the manylinux_2_28 image
        if: ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            /opt/python/cp312-cp312/bin/python -I scripts/build.py "$TARGET" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl | tee SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from PyPI's own sources by this release's workflow run. Check a wheel with \`gh attestation verify <wheel> --repo $GITHUB_REPOSITORY\`." \
            *.whl SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable,assets \
            --jq '{isImmutable, assets: [.assets[] | {name, digest}]}'
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = true
